name: 功能建议
description: 建议面向服务器用户的新能力或文档改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 说明当前遇到的管理问题，而不是内部实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 给出调用方式、输入、输出和错误处理方面的期望。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
  - type: checkboxes
    id: safety
    attributes:
      label: 确认
      options:
        - label: 建议中不包含令牌、漏洞细节、玩家隐私数据或非公开实现资料。
          required: true
